{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="dashboard-page row">
    <div class="col-md-3 mb-3">
        {% include 'dashboards/sidebar.html' %}
    </div>

    <div class="col-md-9">
        <section class="category-form-panel">
            <h2>Add New Post</h2>

            <form action="{% url 'add_post' %}" method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                {{ form | crispy }}
                <!-- <div class="form-group"> -->
                    <!-- <label for="{{ form.title.id_for_label }}">Title<span aria-hidden="true">*</span></label>
                    {{ form.title }}
                    {% for error in form.title.errors %}
                        <small class="category-form-error">{{ error }}</small>
                    {% endfor %}
                </div>

                <div class="form-group">
                    <label for="{{ form.category.id_for_label }}">Category<span aria-hidden="true">*</span></label>
                    {{ form.category }}
                    {% for error in form.category.errors %}
                        <small class="category-form-error">{{ error }}</small>
                    {% endfor %}
                </div>

                <div class="form-group">
                    <label for="{{ form.content.id_for_label }}">Content<span aria-hidden="true">*</span></label>
                    {{ form.content }}
                    {% for error in form.content.errors %}
                        <small class="category-form-error">{{ error }}</small>
                    {% endfor %}
                </div>

                {% for error in form.non_field_errors %}
                    <small class="category-form-error">{{ error }}</small>
                {% endfor %} -->

                <button type="submit" class="btn btn-warning category-submit-button">Submit</button>

        </section>
    </div>
</div>
