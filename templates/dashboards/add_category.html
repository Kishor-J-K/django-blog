{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="dashboard-page row">
    <div class="col-md-3 mb-3">
        {% include 'dashboards/sidebar.html' %}
    </div>

    <div class="col-md-9">
        {% if perms.auth.add_category %}
        <section class="category-form-panel">
            <h1>Add New Category</h1>

            <form action="{% url 'add_category' %}" method="post" novalidate>
                {% csrf_token %}
                {{ form | crispy }}
                <button type="submit" class="btn btn-warning category-submit-button">Submit</button>
            </form>
        </section>
        {% else %}
        <div class="alert alert-danger" role="alert">
            You do not have permission to add a new category.
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
