{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="dashboard-page row">
    <div class="col-md-3 mb-3">
        {% include 'dashboards/sidebar.html' %}
    </div>

    <div class="col-md-9">
        <section class="category-form-panel">
            <h1>Edit Post</h1>

            <form action="{% url 'edit_post' post.id %}" method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                {{ form | crispy }}
                <button type="submit" class="btn btn-warning category-submit-button">Update</button>
            </form>
        </section>
    </div>
</div>
{% endblock %}
