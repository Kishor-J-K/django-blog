{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
  </head>
<body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row align-items-center">
          <div class="col-md-3 col-12 mb-2 mb-md-0">
            <a class="blog-header-logo text-dark" href="/">Blog</a>
          </div>
          <div class="col-md-5 col-12 mb-2 mb-md-0">
            <form action="{% url 'search' %}" method="get">
              <div class="input-group">
                <input class="form-control" type="text" name="keyword" placeholder="Enter search term..." aria-label="Enter search term..." aria-describedby="button-search" />
                <button type="submit" class="btn btn-warning" id="button-search">Go!</button>
              </div>
            </form>
          </div>
          <div class="col-md-4 col-12 d-flex justify-content-md-end justify-content-center align-items-center">
            <a class="btn btn-sm btn-warning mr-2" href="#">sign in</a>
            <a class="btn btn-sm btn-outline-secondary" href="#">Create Account</a>
          </div>
        </div>
      </header>

      <div class="nav-scroller py-1 mb-2">
      <nav class="nav d-flex justify-content-between">

        {% for category in categories %}
          <a class="p-2 text-muted" href="{% url 'posts_by_category' category.id %}">
                {{ category.category_name }}
            </a>
        {% empty %}
            <p>No categories found.</p>
        {% endfor %}

      </nav>
      </div>

{% block content %}



{% endblock %}

<footer class="blog-footer">
  <p>Django blog built with bootstrap by <a href="#">Kishor J K</a></p>
</footer>
</body>
</html>
