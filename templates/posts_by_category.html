{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
  </head>
<body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <div class="col-8 pt-1">
            <a class="blog-header-logo text-dark" href="/">Blog</a>
          </div>
          <div class="col-4 d-flex justify-content-end align-items-center">
            <a class="btn btn-sm btn-warning" href="#">Login</a> &nbsp;
            <a class="btn btn-sm btn-outline-secondary" href="#">Register</a>
          </div>
        </div>
      </header>

   <h3>{{ category.category_name }}</h3>
  <!-- Featured Blogs -->
    <div class="row mb-2 g-2">
      {% for post in posts %}
    <div class="col-md-6">
        <div class="card">
        <div class="card-body">
            <h3>{{post.title}}</h3>
            <small class="mb-1 text-muted">{{ post.updated_at|date:"M d" }} | {{ post.author.username }}</small>
            <p class="card-text">
            {{post.short_description | truncatewords:20}}
            </p>
        </div>
        </div>
    </div>
    {% endfor %}
    </div>




</div>
<footer class="blog-footer">
  <p>Django blog built with bootstrap by <a href="#">Kishor J K</a></p>
</footer>
</body>
</html>
